services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_app_db
    environment:
      POSTGRES_USER: portfolio_app
      POSTGRES_PASSWORD: portfolio_app
      POSTGRES_DB: portfolio_app
    ports:
      - "5432:5432"
    volumes:
      - portfolio_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  portfolio_app_pgdata:
